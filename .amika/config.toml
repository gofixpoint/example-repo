[lifecycle]

setup_script = "amika-scripts/setup.sh"

[agent_credentials]
claude = { type = "api_key" }
# claude = { type = "oauth" }

# Laravel serves both the built React frontend and the /api/todos API
[services.app]
port = 4102
url_scheme = "https"

[env]
MY_VAR = "my-var"

# This secret must be set. Either do it via the UI or from CLI
MY_SECRET = { secret = "my-secret" }

# Public URL of the app, baked into the React build so the browser
# calls the proxied Laravel API instead of localhost
VITE_APP_URL = { service = "app", field = "url" }
